---
- name: Автоматическая настройка локального окружения
  hosts: local
  become: true
  tasks:
    - name: Установка пакета nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    - name: Создание пользовательской веб-страницы
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Инфраструктура настроена через Ansible (IaC)</h1>\n"
        mode: '0644'
    - name: Гарантия запуска службы nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
